name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: locklens
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: locklens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locklens" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create isolated lab database and role
        run: |
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_test -c "CREATE USER locklens_lab WITH PASSWORD 'ci_lab_pw'"
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_test -c "CREATE DATABASE locklens_lab_test OWNER locklens_lab"
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_lab_test -c "CREATE SCHEMA lab AUTHORIZATION locklens_lab"
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_lab_test -c "REVOKE ALL ON SCHEMA public FROM locklens_lab"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://locklens:ci_pw@localhost:5432/locklens_test
          LAB_DATABASE_URL: postgresql://locklens_lab:ci_lab_pw@localhost:5432/locklens_lab_test
          JWT_SECRET: ci-secret
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: locklens
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: locklens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locklens" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Playwright e2e (critical workflow)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          pip install -r ../backend/requirements.txt
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_test -c "CREATE USER locklens_lab WITH PASSWORD 'ci_lab_pw'"
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_test -c "CREATE DATABASE locklens_lab_test OWNER locklens_lab"
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_lab_test -c "CREATE SCHEMA lab AUTHORIZATION locklens_lab"
          PGPASSWORD=ci_pw psql -h localhost -U locklens -d locklens_lab_test -c "REVOKE ALL ON SCHEMA public FROM locklens_lab"
          cd ../backend && (uvicorn app.main:app --port 8000 &) && cd ../frontend
          npm run preview &
          until curl --fail --silent http://127.0.0.1:8000/api/health; do sleep 1; done
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null || { echo "frontend preview server did not become ready" >&2; exit 1; }
          npx playwright test
        env:
          DATABASE_URL: postgresql+psycopg://locklens:ci_pw@localhost:5432/locklens_test
          LAB_DATABASE_URL: postgresql://locklens_lab:ci_lab_pw@localhost:5432/locklens_lab_test
          JWT_SECRET: ci-secret
